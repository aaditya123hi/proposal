<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Love Story</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1424;--bg2:#1f3556;--ink:#fff3ee;--soft:#f3c9d4;--rose:#ff5c8a;--gold:#f6c982;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1424}}
:root[data-theme="dark"]{--bg:#0b1424}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html.lock,html.lock body{overflow:hidden}
body{margin:0;background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg) 70%) fixed,#0b1424;color:var(--ink);
font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-size:1.25rem;line-height:1.6;overflow-x:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1}
section{min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:12vh 1.5rem 3rem}
.script{font-family:"Pinyon Script","Snell Roundhand",cursive;font-weight:400;color:var(--rose);font-size:clamp(3rem,12vw,7rem);line-height:1.05;margin:0;text-shadow:0 0 40px rgba(255,92,138,.55)}
.script span{display:inline-block;opacity:0;transform:translateY(30px) rotateX(-70deg);animation:in .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{to{opacity:1;transform:none}}
.sub{max-width:34ch;margin:1rem auto 0;color:var(--soft);font-style:italic;font-size:clamp(1.15rem,3.6vw,1.5rem)}
.line{max-width:26ch;font-size:clamp(1.6rem,5.5vw,2.5rem);line-height:1.3;margin:0;opacity:0;transform:translateY(24px);transition:opacity 1s,transform 1s}
.line.on{opacity:1;transform:none}
.hint{margin-top:auto;color:var(--soft);font-size:1rem;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}
.btns{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:auto}
button{font:inherit;font-size:1.25rem;padding:.75rem 2rem;border-radius:999px;border:1px solid var(--rose);cursor:pointer;color:var(--ink);background:transparent;transition:transform .25s}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.primary,#yes{background:linear-gradient(135deg,#ff5c8a,#ff8aa8);border-color:transparent;font-weight:600;box-shadow:0 0 30px rgba(255,92,138,.5)}
#yes{animation:beat 1.4s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.06)}}
#intro{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;text-align:center;padding:1.5rem;
background:radial-gradient(100% 80% at 50% 20%,rgba(31,53,86,.88),rgba(11,20,36,.94));transition:opacity 1.2s,visibility 1.2s}
#intro.gone{opacity:0;visibility:hidden;pointer-events:none}
input{font:inherit;font-size:1.4rem;text-align:center;width:min(340px,86vw);padding:.5rem;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--rose)}
input::placeholder{color:#c48a9d}
.row{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;margin-top:.6rem}
.ghost{font-size:1.05rem;padding:.6rem 1.4rem}
#lnk{font-size:.95rem;color:var(--gold)}
.pick label{display:flex;align-items:center;gap:.5rem;color:var(--soft);font-size:1.1rem}
.pick input{width:42px;height:42px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer}
#ask{font-size:clamp(2.4rem,8.5vw,4.6rem)}
#win{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;padding-top:12vh;text-align:center;pointer-events:none}
#win.show{display:flex}
#win .script{animation:pop 1.2s cubic-bezier(.2,1.4,.3,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.c{position:fixed;top:-2rem;z-index:6;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.script span,.line{animation:none;opacity:1;transform:none;transition:none}#yes,.hint{animation:none}}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>

<div id="intro">
  <h1 class="script">Our love story</h1>
  <p class="sub">Type two names and press begin.</p>
  <input id="fromIn" placeholder="Your name" maxlength="24" autocomplete="off">
  <input id="toIn" placeholder="Their name" maxlength="24" autocomplete="off">
  <div class="row pick"><label>Her dress <input type="color" id="dressC" value="#ff6f9c" aria-label="Dress color"></label><label>His suit <input type="color" id="suitC" value="#2c3e6b" aria-label="Suit color"></label></div>
  <div class="row"><button id="go" class="primary">Begin the story</button><button id="copy" class="ghost">Get link to send</button></div>
  <input id="lnk" readonly hidden aria-label="Shareable link">
</div>

<main>
  <section><h1 class="script" id="title"></h1><p class="sub">A love story, told in four small chapters.</p><div class="hint">scroll slowly</div></section>
  <section><p class="line" id="c1"></p></section>
  <section><p class="line" id="c2"></p></section>
  <section><p class="line" id="c3"></p></section>
  <section><h2 class="script" id="ask"></h2><p class="sub" id="sign"></p>
    <div class="btns"><button id="yes">Yes, forever</button><button id="no">Let me think</button></div></section>
</main>

<div id="win" role="status"><h2 class="script">She said yes!</h2><p class="sub">Forever starts now. I love you.</p></div>

const PM=new THREE.Vector3(-.3,G,.14),PS=new THREE.Vector3(.285,G,-.319);
const at=(o,s,n,h)=>o.clone().addScaledVector(F,s).addScaledVector(NN,n).setY(G+h);
const C0=at(PM,.42,-.33,1.38),cM=C0.clone().setY(C0.y-.03),cW=C0.clone().setY(C0.y+.015),RT=at(PM,.4,.02,1.43),MT=at(PS,-.2,.03,1.95);
const PLh=new THREE.Vector3(.7,-1,.15),PLr=new THREE.Vector3(-.7,-1,.15),YD=new THREE.Vector3(0,-1,0),XA=new THREE.Vector3(1,0,0);
const q1=new THREE.Quaternion(),q2=new THREE.Quaternion(),vd=new THREE.Vector3(),vu=new THREE.Vector3(),vp=new THREE.Vector3(),ve=new THREE.Vector3(),vt=new THREE.Vector3();
function reach(a,T,pole,k,L1,L2){
 const P=a.parent;vt.copy(T);P.worldToLocal(vt);vd.copy(vt).sub(a.position);
 const D=Math.min(vd.length(),L1+L2-.01);vu.copy(vd).normalize();
 const an=Math.acos(Math.max(-1,Math.min(1,(L1*L1+D*D-L2*L2)/(2*L1*D))));
 vp.copy(pole).addScaledVector(vu,-pole.dot(vu)).normalize();
 ve.copy(vu).multiplyScalar(Math.cos(an)).addScaledVector(vp,Math.sin(an));
 q1.setFromUnitVectors(YD,ve);
 vd.copy(a.position).addScaledVector(ve,L1);vt.sub(vd).normalize().applyQuaternion(q2.copy(q1).invert());
 q2.setFromUnitVectors(YD,vt);
 a.quaternion.slerp(q1,k);a.el.quaternion.slerp(q2,k)}

C.position.set(0,0,8);
let ps=0,cel=0,amp=0,ph=0;const t0=performance.now();
(function loop(){
 const t=(performance.now()-t0)/1000,max=document.documentElement.scrollHeight-innerHeight;
 const p=started&&max>0?Math.min(1,scrollY/max):0;
 ps+=(p-ps)*.07;amp+=(Math.min(1,Math.abs(p-ps)*60)-amp)*.15;ph+=amp*.28;cel+=(celebrate-cel)*.05;
 const e=ss(.16,.66,ps),hold=ss(.66,.74,ps)*(1-ss(.83,.9,ps)),k=ss(.86,.98,ps)*(1-cel),sw=Math.sin(ph)*amp,x=lerp(SX,4.4,ss(0,.15,ps))-3.85*e;

 he.position.set(lerp(-x,PM.x,k),G-k*.71+j1,lerp(0,PM.z,k));she.position.set(lerp(x,PS.x,k),G+j2,lerp(0,PS.z,k));
 const A=ss(0,.07,ps),B=ss(.14,.2,ps);he.rotation.y=(-Math.PI/2*A+Math.PI*B+.25*k)*(1-cel);she.rotation.y=(Math.PI/2*A-Math.PI*B+.25*k)*(1-cel);
 he.lL.rotation.x=sw*.8*(1-k)+.1*k;he.lR.rotation.x=-sw*.8*(1-k)-1.515*k;she.lL.rotation.x=-sw*.8;she.lR.rotation.x=sw*.8;
 he.lL.kn.rotation.x=Math.max(0,he.lL.rotation.x)*.6*(1-k)+1.628*k;he.lR.kn.rotation.x=Math.max(0,he.lR.rotation.x)*.6*(1-k)+1.515*k;
 [he.aL,he.aR,she.aL,she.aR].forEach(a=>{a.rotation.set(0,0,0);a.el.rotation.set(0,0,0)});he.aL.rotation.x=-sw*.6;she.aR.rotation.x=-sw*.6;
 he.aR.rotation.x=lerp(sw*.6,-1.25,hold);she.aL.rotation.x=lerp(sw*.6,-1.25,hold);
 const wv=-3+Math.sin(t*9)*.35;
 [he.aL,he.aR,she.aL,she.aR].forEach(a=>a.rotation.x=lerp(a.rotation.x,wv,cel));
 const sh=(1-ss(0,.1,ps))*(1-cel);
 const pz=(a,z,ez)=>{a.rotation.x=lerp(a.rotation.x,0,sh);a.rotation.z=lerp(0,z,sh);a.el.rotation.z=lerp(0,ez,sh)};
 pz(he.aL,-.7,1.5);pz(he.aR,.12,-.2);pz(she.aL,-.75,1.6);pz(she.aR,.75,-1.6);
 he.lR.rotation.z=.1*sh;she.lL.rotation.z=.05*sh;
 he.head.rotation.set(-.5*k,.28*k,Math.sin(t*1.5)*.06);she.head.rotation.set(.22*k,.29*k,Math.sin(t*1.5+1)*.06);
 ring.visible=k>.3;rg.rotation.y=t*2;gm.rotation.z=t*2;
 [[he,.4],[she,1]].forEach(([c,a])=>{const f=c.fx,w=k*a;f.E.forEach(n=>n.scale.copy(n.userData.s).multiplyScalar(1+.16*w));f.B.forEach(n=>n.position.y=n.userData.y+.03*w);f.mg.scale.set(1+.25*w,1+.5*w,1);f.mo.scale.set(f.mw*.75*w+.001,f.mw*.5*w+.001,.01*w+.001);f.CK.forEach(n=>n.scale.set(.055*w+.001,.035*w+.001,.018*w+.001))});
 if(k>0){he.updateMatrixWorld(true);she.updateMatrixWorld(true);
  reach(he.aR,cM,PLh,k,.5,.54);reach(she.aL,cW,PLr,k,.46,.44);reach(he.aL,RT,PLr,k,.5,.54);reach(she.aR,MT,PLh,k,.46,.44);
  he.updateMatrixWorld(true);he.aL.el.getWorldQuaternion(q1);ring.quaternion.copy(q1).invert().multiply(he.quaternion).multiply(q2.setFromAxisAngle(XA,.35))}
 const beat=1+Math.pow(Math.max(0,Math.sin(t*(cel?7:2.6))),8)*.15;
 mid.scale.setScalar((.55*ss(.62,.72,ps)+cel*.5)*beat);mid.position.set(0,.95+Math.sin(t*2)*.1,0);mid.rotation.y=t*.8;
 for(let i=0;i<N;i++){const d=dd[i],y=((d.y+t*d.v+8)%16)-8;
  o3.position.set(d.x+Math.sin(t*.7+d.w)*.5,y,d.z);o3.rotation.set(t*.4+d.r,t*.6+d.r,0);o3.scale.setScalar(d.s*(1+cel*.6));o3.updateMatrix();mini.setMatrixAt(i,o3.matrix)}
 mini.instanceMatrix.needsUpdate=true;
 C.position.x+=(mx*.8-C.position.x)*.04;C.position.y+=(.3-my*.5-C.position.y)*.04;const zm=Math.max(ss(.6,.95,ps),cel),sc=1-ss(0,.12,ps);C.position.z+=(C.userData.z*(1-.22*zm)*lerp(1,.78,sc)-C.position.z)*.04;
 C.lookAt(0,-.6+.7*zm+.8*sc,0);R.render(S,C);requestAnimationFrame(loop)})();

// Playful "No"
const no=$('no'),yes=$('yes');let dodges=0;
function dodge(e){if(e)e.preventDefault();dodges++;no.style.position='fixed';
 no.style.left=Math.random()*(innerWidth-no.offsetWidth-20)+10+'px';no.style.top=Math.random()*(innerHeight-no.offsetHeight-20)+10+'px';
 no.style.transform='scale('+Math.max(.6,1-dodges*.07)+')';if(dodges>4)no.textContent='Okay, yes!';
 yes.style.transform='scale('+Math.min(1.4,1+dodges*.07)+')'}
no.addEventListener('pointerenter',()=>{if(dodges<=4)dodge()});
no.addEventListener('touchstart',e=>{if(dodges<=4)dodge(e)},{passive:false});
no.addEventListener('click',e=>{dodges>4?say():dodge(e)});

}
